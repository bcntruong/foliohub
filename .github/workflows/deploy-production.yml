name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @foliohub/web
      - name: Apply production database migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply foliohub-production --remote
      - name: Deploy API Worker
        working-directory: apps/api
        run: npx wrangler deploy --env=""
      - name: Deploy frontend to Pages
        run: npx wrangler pages deploy apps/web/dist --project-name foliohub --branch main
